
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <header>
            <h1>Language Translator</h1>
            <p>Break language barriers with smart translation</p>
        </header>

        <main class="translator-box">

            <div class="language-selection">

                <div class="language-group">
                    <label for="sourceLang">Translate From</label>
                    <select id="sourceLang">
                        <option value="en">English</option>
                        <option value="kn">Kannada</option>
                        <option value="hi">Hindi</option>
                        <option value="ta">Tamil</option>
                        <option value="te">Telugu</option>
                        <option value="ml">Malayalam</option>
                        <option value="fr">French</option>
                        <option value="es">Spanish</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="ja">Japanese</option>
                        <option value="zh-CN">Chinese</option>
                        <option value="ar">Arabic</option>
                    </select>
                </div>

                <button id="swapBtn" class="swap-btn" title="Swap languages">⇄</button>

                <div class="language-group">
                    <label for="targetLang">Translate To</label>
                    <select id="targetLang">
                        <option value="kn">Kannada</option>
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="ta">Tamil</option>
                        <option value="te">Telugu</option>
                        <option value="ml">Malayalam</option>
                        <option value="fr">French</option>
                        <option value="es">Spanish</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="ja">Japanese</option>
                        <option value="zh-CN">Chinese</option>
                        <option value="ar">Arabic</option>
                    </select>
                </div>

            </div>

            <div class="text-area-container">

                <div class="text-box">
                    <label for="inputText">Enter Text</label>
                    <textarea id="inputText"
                        placeholder="Type or paste your text here..."
                        maxlength="5000"></textarea>
                    <span id="charCount">0 / 5000</span>
                </div>

                <div class="text-box">
                    <label for="outputText">Translated Text</label>
                    <textarea id="outputText"
                        placeholder="Your translation will appear here..."
                        readonly></textarea>
                    <button id="copyBtn" class="copy-btn">Copy Translation</button>
                </div>

            </div>

            <button id="translateBtn" class="translate-btn">
                Translate Now
            </button>

            <p id="statusMessage" role="status" aria-live="polite"></p>

        </main>

        <footer>
            <p>AI Language Translation Tool | CodeAlpha Internship Project</p>
        </footer>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
